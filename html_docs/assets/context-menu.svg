<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-labelledby="ct cd">
  <title id="ct">Right-click menu</title>
  <desc id="cd">A context menu listing Edit, Duplicate, Copy, Paste, Copy Style, Paste style, Reset style, Save as Template, and Delete.</desc>
  <rect width="420" height="360" fill="#f7f3ea"/>
  <rect x="40" y="24" width="280" height="312" rx="8" fill="#fff" stroke="#d7dce2"/>
  <g font-family="Segoe UI, sans-serif" font-size="15" fill="#1d252b">
    <text x="60" y="56">Edit Heading</text>
    <text x="60" y="86">Duplicate</text>
    <text x="60" y="116">Copy</text>
    <text x="60" y="146">Paste</text>
    <text x="60" y="176">Copy Style</text>
    <text x="60" y="206">Paste style</text>
    <text x="60" y="236">Reset style</text>
    <text x="60" y="276">Save as Template</text>
    <text x="60" y="312" fill="#9b2c2c">Delete</text>
  </g>
</svg>
