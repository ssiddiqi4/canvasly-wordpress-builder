<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-labelledby="st sd">
  <title id="st">Settings screen sketch</title>
  <desc id="sd">A WordPress admin page titled Canvasly Settings with tabs across the top and a form underneath.</desc>
  <rect width="880" height="280" fill="#f0f0f1"/>
  <text x="28" y="42" fill="#1d2327" font-family="Segoe UI, sans-serif" font-size="22">Canvasly Settings</text>
  <rect x="28" y="62" width="110" height="32" fill="#fff" stroke="#c3c4c7"/>
  <rect x="138" y="62" width="120" height="32" fill="#f0f0f1" stroke="#c3c4c7"/>
  <rect x="258" y="62" width="110" height="32" fill="#f0f0f1" stroke="#c3c4c7"/>
  <rect x="368" y="62" width="130" height="32" fill="#f0f0f1" stroke="#c3c4c7"/>
  <rect x="498" y="62" width="90" height="32" fill="#f0f0f1" stroke="#c3c4c7"/>
  <rect x="588" y="62" width="100" height="32" fill="#f0f0f1" stroke="#c3c4c7"/>
  <text x="48" y="83" fill="#1d2327" font-family="Segoe UI, sans-serif" font-size="13">General</text>
  <text x="154" y="83" fill="#50575e" font-family="Segoe UI, sans-serif" font-size="13">Integrations</text>
  <text x="278" y="83" fill="#50575e" font-family="Segoe UI, sans-serif" font-size="13">Advanced</text>
  <text x="388" y="83" fill="#50575e" font-family="Segoe UI, sans-serif" font-size="13">Performance</text>
  <text x="518" y="83" fill="#50575e" font-family="Segoe UI, sans-serif" font-size="13">Tools</text>
  <text x="608" y="83" fill="#50575e" font-family="Segoe UI, sans-serif" font-size="13">Features</text>
  <rect x="28" y="108" width="824" height="148" fill="#fff" stroke="#c3c4c7"/>
  <text x="48" y="146" fill="#1d2327" font-family="Segoe UI, sans-serif" font-size="14">Post Types</text>
  <rect x="220" y="130" width="16" height="16" fill="#2271b1"/>
