  <rect x="320" y="130" width="16" height="16" fill="#2271b1"/>
  <text x="344" y="144" fill="#1d2327" font-family="Segoe UI, sans-serif" font-size="14">Pages</text>
  <text x="48" y="190" fill="#1d2327" font-family="Segoe UI, sans-serif" font-size="14">Default Colors</text>
  <rect x="220" y="176" width="16" height="16" fill="#fff" stroke="#8c8f94"/>
  <text x="244" y="190" fill="#50575e" font-family="Segoe UI, sans-serif" font-size="14">Disable default colors</text>
  <rect x="48" y="214" width="120" height="28" rx="3" fill="#2271b1"/>
  <text x="68" y="233" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13">Save Changes</text>
