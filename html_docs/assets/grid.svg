<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" role="img" aria-labelledby="gt gd">
  <title id="gt">Grid on the canvas</title>
  <desc id="gd">A three by two grid of cells with one cell spanning two columns, plus a placement summary.</desc>
  <rect width="880" height="260" fill="#f7f3ea"/>
  <text x="24" y="36" fill="#1c1915" font-family="Georgia, serif" font-size="20">Grid</text>
  <g fill="#fff" stroke="#9bb7e0" stroke-width="2">
    <rect x="24" y="56" width="150" height="90" rx="6"/>
    <rect x="186" y="56" width="150" height="90" rx="6"/>
    <rect x="348" y="56" width="150" height="90" rx="6"/>
    <rect x="24" y="158" width="312" height="78" rx="6" fill="#e7f0ff"/>
    <rect x="348" y="158" width="150" height="78" rx="6"/>
  </g>
  <text x="70" y="108" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="14">Column 1</text>
  <text x="230" y="108" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="14">Column 2</text>
  <text x="392" y="108" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="14">Column 3</text>
  <text x="110" y="202" fill="#17386d" font-family="Segoe UI, sans-serif" font-size="14">Spans two columns</text>
  <rect x="530" y="56" width="320" height="180" rx="10" fill="#fff" stroke="#e2d8c8"/>
  <text x="550" y="90" fill="#1c1915" font-family="Segoe UI, sans-serif" font-size="16">Placement</text>
  <text x="550" y="122" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="14">Column 1 &#183; Row 2 &#183; 2 &#215; 1</text>
  <text x="550" y="160" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="14">Drag an edge to resize.</text>
  <text x="550" y="190" fill="#5c564c" font-family="Segoe UI, sans-serif" font-size="14">Neighboring columns share width.</text>
</svg>
