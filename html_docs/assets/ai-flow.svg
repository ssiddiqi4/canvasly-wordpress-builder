<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="at ad">
  <title id="at">How an agent updates a Canvasly page</title>
  <desc id="ad">Four steps: save a provider key, turn on MCP and copy a token, the agent reads the layout, then the agent saves through WordPress.</desc>
  <rect width="880" height="220" fill="#f7f3ea"/>
  <g font-family="Segoe UI, sans-serif" font-size="13" fill="#1c1915">
    <rect x="16" y="36" width="190" height="120" rx="10" fill="#fff" stroke="#e2d8c8"/>
    <text x="32" y="68">1. AI Connection</text>
    <text x="32" y="94" fill="#5c564c">Save a provider key.</text>
    <text x="32" y="116" fill="#5c564c">Test connection only</text>
    <text x="32" y="136" fill="#5c564c">checks that key.</text>
    <rect x="230" y="36" width="190" height="120" rx="10" fill="#fff" stroke="#e2d8c8"/>
    <text x="246" y="68">2. MCP token</text>
    <text x="246" y="94" fill="#5c564c">Enable MCP and</text>
    <text x="246" y="116" fill="#5c564c">generate a token.</text>
    <text x="246" y="136" fill="#5c564c">Store it in the agent.</text>
    <rect x="444" y="36" width="190" height="120" rx="10" fill="#fff" stroke="#3f7fdf"/>
    <text x="460" y="68">3. Read</text>
    <text x="460" y="94" fill="#5c564c">The agent reads the</text>
    <text x="460" y="116" fill="#5c564c">layout from WordPress.</text>
    <text x="460" y="136" fill="#5c564c">It cannot save here.</text>
    <rect x="658" y="36" width="200" height="120" rx="10" fill="#eef4ff" stroke="#3f7fdf"/>
    <text x="674" y="68">4. Save</text>
    <text x="674" y="94" fill="#5c564c">A separate WordPress</text>
    <text x="674" y="116" fill="#5c564c">login saves the layout.</text>
    <text x="674" y="136" fill="#5c564c">Canvasly draws the page.</text>
  </g>
  <path d="M206 96h24M420 96h24M634 96h24" stroke="#3f7fdf" stroke-width="2"/>
</svg>
