<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/css/editor.css">
<style>
  body{margin:0;background:#e8ebef}
  .lb-panel.right{width:300px;background:#fff;padding:12px;box-sizing:border-box}
</style>
</head>
<body>
<div class="lb-panel right">
  <div class="lb-tab-content visible">
    <div class="lb-control lb-slider lb-slider-unitless" data-slider-key="line_height">
      <span>Line Height</span>
      <div class="lb-slider-row">
        <input class="lb-slider-range" type="range" min="0.6" max="3" step="0.05" value="1.4">
        <input class="lb-slider-num" type="number" value="1.4">
      </div>
    </div>
    <div class="lb-control lb-slider" data-slider-key="letter_spacing">
      <span>Letter Spacing</span>
      <div class="lb-slider-row">
        <input class="lb-slider-range" type="range" min="-5" max="20" step="0.1" value="0">
        <input class="lb-slider-num" type="number" value="0">
        <select class="lb-slider-unit"><option>px</option><option>em</option></select>
      </div>
    </div>
    <div class="lb-control lb-shadow">
      <span>Text Shadow</span>
      <div class="lb-shadow-grid">
        <div class="lb-control lb-slider lb-slider-unitless"><span>X</span><div class="lb-slider-row"><input class="lb-slider-range" type="range" value="0"><input class="lb-slider-num" type="number" value="0"></div></div>
        <div class="lb-control lb-slider lb-slider-unitless"><span>Y</span><div class="lb-slider-row"><input class="lb-slider-range" type="range" value="0"><input class="lb-slider-num" type="number" value="0"></div></div>
        <div class="lb-control lb-slider lb-slider-unitless"><span>Blur</span><div class="lb-slider-row"><input class="lb-slider-range" type="range" value="0"><input class="lb-slider-num" type="number" value="0"></div></div>
        <label class="lb-control"><span>Color</span><input type="color" value="#000000"></label>
      </div>
    </div>
  </div>
</div>
</body>
</html>
