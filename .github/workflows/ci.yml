name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported ("Requires PHP" in the plugin header) and current.
        php: [ "7.4", "8.3" ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Check PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            out=$(php -l "$file" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $status

  wordpress-smoke:
    name: WordPress smoke test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          coverage: none
          tools: wp-cli
      - name: Activate plugin and load the editor
        run: .github/scripts/wp-smoke-test.sh
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASS: root
          DB_NAME: wordpress
      - name: Upload pages and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: |
            /tmp/smoke-*.html
            /tmp/wordpress/wp-content/debug.log
            /tmp/wp-server.log
          if-no-files-found: ignore
