name: PHP lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - run: php --version
    - name: Check PHP syntax
      run: |
        status=0
        find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l > lint.log 2>&1 || status=$?
        grep -v '^No syntax errors detected' lint.log || true
        exit $status
